name: Despliegue Automático en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Preparar Directorio de Publicación
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          mkdir -p _site/data/r2_export
          cp -r data/r2_export/* _site/data/r2_export/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir Artefacto Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
