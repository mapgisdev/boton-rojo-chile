name: Inferencia Diaria Automatizada BR-HR

on:
  schedule:
    # Corre automáticamente todos los días a las 11:00 UTC (08:00 AM hora de Chile)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Inferencia Diaria (Earth Engine GFS + NASA FIRMS)
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python src/gee/gee_inference_pipeline.py

      - name: Publicar Pronóstico Actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/r2_export/*.json
          git commit -m "chore(forecast): actualización automática diaria de Botón Rojo y NASA FIRMS [skip ci]" || echo "Sin cambios nuevos"
          git push origin main || echo "Push omitido"
